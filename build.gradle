plugins {
    id 'java'
    id 'java-library'
}

group = 'org.example.simple'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
    mavenCentral()
}

dependencies {

    implementation 'ch.qos.logback:logback-classic:1.6.2'

    /* httpclient 工具依赖 */
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    /* Netty 实现 RPC 高性能通信 */
    implementation 'io.netty:netty-all:4.2.16.Final'
    implementation 'tools.jackson.core:jackson-databind:3.2.2'
    implementation 'io.protostuff:protostuff-core:1.8.0'
    implementation 'io.protostuff:protostuff-runtime:1.8.0'
    implementation 'com.alibaba.nacos:nacos-client:2.5.1'
    implementation 'io.micrometer:micrometer-core:1.14.6'
    implementation 'io.opentelemetry:opentelemetry-api:1.49.0'

    /* 日常工具依赖 */
    implementation 'commons-io:commons-io:2.22.0'
    implementation 'org.apache.commons:commons-collections4:4.6.0'
    implementation 'commons-codec:commons-codec:1.22.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'

    /* 核心JCA/JCE Provider，对称/非对称加密、摘要、签名都靠它 */
    implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
    /* 如果要处理证书、CMS、PKCS7/12这类PKI相关操作再加这个 */
    implementation 'org.bouncycastle:bcpkix-jdk18on:1.86'

    implementation 'org.apache.groovy:groovy:5.1.2'
    implementation 'org.graalvm.polyglot:js:25.2.4'
    implementation 'org.graalvm.polyglot:polyglot:25.2.4'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

/* Gradle 指定编码,Java 编译的时候缺省状态下会因为中文字符而失败 */
[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}
