plugins {
	id 'java'
	id 'org.springframework.boot' version "${SpringBootVersion}"
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.nihility.gw'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
	mavenCentral()
}

ext {
	//set('springCloudVersion', "2025.1.3")
}

/* 全局排除 Logback 默认日志实现，避免与 Log4j2 的 SLF4J 绑定冲突
   (spring-boot-starter-web / webflux / nacos 都会传递引入 spring-boot-starter-logging) */
configurations.configureEach {
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'

    /* Feign底层用HttpClient替代默认的HttpURLConnection，支持连接池，性能更好 */
    implementation 'io.github.openfeign:feign-hc5:13.9.2'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'

    implementation 'com.github.ben-manes.caffeine:caffeine:3.2.4'
    /* 熔断与限流的实现。版本不要显式写：spring-cloud-dependencies BOM 会覆盖它
       (声明 5.0.2 实际解析到 3.3.3，resilience4j 核心库 2.2.0)，写死只会误导 */
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-reactor-resilience4j'

    /* Reactor 与 ThreadLocal(MDC) 的上下文桥接，WebFlux 下跨线程传递 traceId 必需 */
    implementation 'io.micrometer:context-propagation'

    /* 异步日志需要的Disruptor高性能队列(LMAX Disruptor) */
    implementation 'com.lmax:disruptor:4.0.0'
    // 换成Log4j2
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    implementation 'org.springframework.cloud:spring-cloud-starter'
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config:${CloudAliNacosVersion}"
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery:${CloudAliNacosVersion}"

    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    //testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${SpringCloudVersion}"
	}
}

tasks.named('test') {
	useJUnitPlatform()
}

/* Gradle 指定编码,Java 编译的时候缺省状态下会因为中文字符而失败 */
[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}

