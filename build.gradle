plugins {
	id 'java'
    id 'java-library'
	id 'org.springframework.boot' version "${SpringBootVersion}"
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public/' }
	mavenCentral()
}

ext {
    //set('SpringCloudVersion', "2025.1.2")
    // 较新版本用 jackson-bom.version，较老版本用 jackson.version
    // ext['jackson.version'] = '2.22.2'
    // ext['jackson-bom.version'] = '2.22.2'
}

configurations.configureEach {
    exclude group: 'ch.qos.logback', module: 'logback-core'
    exclude group: 'ch.qos.logback', module: 'logback-classic'
    exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
}

configurations {
    mockitoAgent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    /* 异步日志需要的Disruptor高性能队列(LMAX Disruptor) */
    implementation 'com.lmax:disruptor:4.0.0'
    // 换成Log4j2
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    /* 对接Prometheus必须的依赖，暴露/actuator/prometheus端点 */
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.apache.commons:commons-pool2'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    /* Feign底层用HttpClient替代默认的HttpURLConnection，支持连接池，性能更好 */
    implementation 'io.github.openfeign:feign-hc5:13.9.2'
    implementation 'org.springframework.cloud:spring-cloud-starter-openfeign'
    implementation 'org.springframework.cloud:spring-cloud-starter-loadbalancer'
    implementation 'org.springframework.cloud:spring-cloud-starter-circuitbreaker-resilience4j'
    /* spring-cloud-starter-circuitbreaker-resilience4j 只带来了断路器/重试/限流器/超时限制，
       隔板(Bulkhead)模块未被间接引入，需要单独声明；版本沿用spring-cloud-dependencies BOM的托管版本 */
    implementation 'io.github.resilience4j:resilience4j-bulkhead'
    /* resilience4j-spring6 里的 CircuitBreakerAspect/RetryAspect/RateLimiterAspect/BulkheadAspect
       都是@Aspect类，依赖AspectJ的注解切点解析能力才能被Spring AOP识别并生效；只有spring-aop
       (Spring自身的动态代理AOP)是不够的，必须显式引入这个starter带上aspectjweaver，否则
       @CircuitBreaker等注解会被静默忽略，方法照常抛出原始异常，fallback永远不会被调用 */
    implementation 'org.springframework.boot:spring-boot-starter-aop'

    implementation 'org.springframework.cloud:spring-cloud-starter'
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config:${CloudAliNacosVersion}"
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery:${CloudAliNacosVersion}"

    /* springdoc 3.x 目标 Spring Boot 4，与本项目的 Spring Boot 3.5 不兼容，固定使用 2.x 系列的最新版 */
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'

    implementation 'com.mysql:mysql-connector-j:9.6.0'

    implementation 'org.mybatis:mybatis-spring:3.0.6'
    /* MyBatis-Plus 3.5.x 把分页拦截器依赖的 JSQLParser 拆到了独立模块，PaginationInnerInterceptor 需要它才能生效 */
    implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.16'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'

    implementation 'org.mapstruct:mapstruct:1.6.3'
    implementation 'org.apache.httpcomponents.client5:httpclient5:5.6.4'

    /*implementation 'com.fasterxml.jackson.core:jackson-core:2.22.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.22.2'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jdk8:2.22.2'*/

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor "org.mapstruct:mapstruct-processor:1.6.3"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // 之前讨论过的Mockito javaagent修复
    mockitoAgent('org.mockito:mockito-core') {
        transitive = false
    }

}

dependencyManagement {
    imports {
        mavenBom "com.fasterxml.jackson:jackson-bom:${JacksonVersion}"
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${SpringCloudVersion}"
    }
}

tasks.named('test') {
	useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.singleFile}"
}

/* Gradle 指定编码,Java 编译的时候缺省状态下会因为中文字符而失败 */
[compileJava, compileTestJava, javadoc]*.options*.encoding = 'UTF-8'
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << "-Xlint:deprecation"
}
