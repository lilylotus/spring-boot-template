plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

ext {
	set('FlowableVersion', "7.2.0")
}

repositories {
	maven { url = 'https://maven.aliyun.com/repository/public/' }
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	implementation 'org.mapstruct:mapstruct:1.6.3'

	implementation 'org.flywaydb:flyway-mysql:12.8.1'
	implementation 'com.mysql:mysql-connector-j:9.6.0'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'

	implementation 'org.mybatis:mybatis-spring:3.0.5'
	/* MyBatis-Plus 3.5.x 把分页拦截器依赖的 JSQLParser 拆到了独立模块，
       PaginationInnerInterceptor 需要它才能生效 */
	implementation 'com.baomidou:mybatis-plus-jsqlparser:3.5.16'
	implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.16'

	/* 流程管理 */
	implementation "org.flowable:flowable-spring-boot-starter:${FlowableVersion}"
	// ============ Flowable 核心：流程引擎 ============
	implementation "org.flowable:flowable-spring-boot-starter-process:${FlowableVersion}"

	implementation 'org.apache.commons:commons-lang3:3.20.0'
	implementation 'org.apache.httpcomponents:httpclient:4.5.14'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}
