server:
  port: 45678
spring:
  application:
    name: FlowableTemplate

  # 以下数据源配置为本地开发占位值（localhost:3306 / rbac_demo / root / root），
  # 仅用于离线编译和联调脚手架，各环境（测试/预发/生产）务必替换为各自的真实连接信息，
  # 不要把生产凭据提交到仓库。
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # nullCatalogMeansCurrent=true 避免 Flowable 在同一 MySQL 实例的其他数据库中发现 ACT_* 表后，
    # 误判当前数据库已完成初始化并错误执行升级脚本。
    url: jdbc:mysql://10.10.88.31:3306/flowable?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&nullCatalogMeansCurrent=true
    username: root
    password: mysql

  data:
    redis:
      database: 11
      password: redis
      host: 10.10.88.31
      port: 6379
      connect-timeout: 3000ms

  # 数据库版本由 Flyway 管理，迁移脚本位于 src/main/resources/db/migration，
  # 命名规范为 V<版本号>__<描述>.sql
  # 避免应用启动阶段因连接失败而报错；连接到真实数据库后再打开。
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  config-location: classpath:mybatis/mybatis.conf
  mapper-locations: classpath*:mybatis/mapper/*.xml
  global-config:
    db-config:
      id-type: auto

# Flowable 流程引擎：只启用 process 引擎，复用 @Primary 业务数据源
# ACT_* 与 person / approval_* / flyway_schema_history 同库（flowable）同连接，事务由 Spring Boot 自动装配的单个事务管理器负责
flowable:
  # 在业务库 flowable 自动建 / 升级 ACT_* 表（幂等）；ACT_* 不纳入 Flyway
  database-schema-update: true
  # 同步顺序审批流不需要异步作业执行器 / 定时器
  async-executor-activate: false
  # 启动时从 classpath*:/processes/ 自动部署 BPMN
  check-process-definitions: true
  # 审批历史由业务表 approval_request_history 负责，引擎历史级别关到最低
  history-level: audit

logging:
  level:
    com.example: debug