<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE configuration
        PUBLIC "-//mybatis.org//DTD Config 3.0//EN"
        "http://mybatis.org/dtd/mybatis-3-config.dtd">
<!--
    MyBatis-Plus 的 MybatisSqlSessionFactoryBean 要求 config-location 指向的文件必须存在，
    否则应用启动即报 FileNotFoundException（见 application.yaml 中 mybatis-plus.config-location）。
    本文件是最小可用配置：开启下划线转驼峰映射、关闭二级缓存（业务代码未做缓存一致性处理前不默认开启）。
-->
<configuration>
    <settings>
        <setting name="mapUnderscoreToCamelCase" value="true"/>
        <setting name="cacheEnabled" value="false"/>
    </settings>
</configuration>
