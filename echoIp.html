<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>网络探针 · IP 回显</title>
    <style>
        :root {
            color-scheme: dark;
            --deep-sea: #07131f;
            --panel: #0e2638;
            --signal: #4de4c1;
            --signal-soft: #9af7df;
            --ink: #f5fbff;
            --muted: #9eb3c4;
            --danger: #ffb86b;
            --line: rgb(158 179 196 / 18%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            align-items: center;
            background:
                linear-gradient(rgb(77 228 193 / 5%) 1px, transparent 1px),
                linear-gradient(90deg, rgb(77 228 193 / 5%) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, #153a50 0%, var(--deep-sea) 48rem);
            background-size: 2rem 2rem, 2rem 2rem, auto;
            color: var(--ink);
            display: grid;
            font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
            margin: 0;
            min-height: 100svh;
            padding: 1.5rem;
        }

        main {
            margin: auto;
            max-width: 46rem;
            width: 100%;
        }

        .probe {
            background: linear-gradient(145deg, rgb(20 59 80 / 88%), var(--panel));
            border: 1px solid var(--line);
            box-shadow: 0 1.5rem 5rem rgb(0 0 0 / 35%);
            overflow: hidden;
            padding: clamp(1.5rem, 5vw, 3rem);
            position: relative;
        }

        .probe::before {
            background: linear-gradient(90deg, transparent, var(--signal), transparent);
            content: "";
            height: 1px;
            left: 0;
            opacity: .55;
            position: absolute;
            right: 0;
            top: 0;
        }

        .probe-header {
            align-items: center;
            display: flex;
            gap: 1rem;
            justify-content: space-between;
        }

        .eyebrow,
        .connection-state,
        .status {
            color: var(--muted);
            font-size: .78rem;
            letter-spacing: .1em;
            margin: 0;
            text-transform: uppercase;
        }

        h1 {
            font-size: clamp(1.6rem, 5vw, 2.5rem);
            font-weight: 650;
            letter-spacing: -.045em;
            margin: .5rem 0 0;
        }

        .connection-state {
            align-items: center;
            display: inline-flex;
            gap: .5rem;
            white-space: nowrap;
        }

        .signal-dot {
            background: var(--signal);
            border-radius: 50%;
            box-shadow: 0 0 1rem var(--signal);
            height: .55rem;
            width: .55rem;
        }

        .is-loading .signal-dot {
            animation: pulse 1s ease-in-out infinite alternate;
        }

        .is-error .signal-dot {
            background: var(--danger);
            box-shadow: 0 0 1rem var(--danger);
        }

        .readout {
            margin: clamp(3rem, 10vw, 5rem) 0 2rem;
        }

        .readout-label {
            color: var(--muted);
            display: block;
            font-size: .92rem;
            margin-bottom: .8rem;
        }

        .signal-track {
            align-items: center;
            display: flex;
            gap: 1rem;
        }

        .signal-track::before,
        .signal-track::after {
            background: linear-gradient(90deg, transparent, var(--signal));
            content: "";
            flex: 1;
            height: 1px;
            min-width: 1rem;
        }

        .signal-track::after {
            transform: scaleX(-1);
        }

        output {
            color: var(--ink);
            font-family: "Cascadia Code", Consolas, monospace;
            font-size: clamp(1.4rem, 5.6vw, 3.4rem);
            font-variant-numeric: tabular-nums;
            letter-spacing: -.06em;
            overflow-wrap: anywhere;
            text-align: center;
            user-select: all;
        }

        .is-loading output {
            color: var(--signal-soft);
        }

        .is-error output {
            color: var(--danger);
            font-size: clamp(1rem, 3vw, 1.3rem);
            letter-spacing: 0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
        }

        button {
            background: transparent;
            border: 1px solid var(--line);
            color: var(--ink);
            cursor: pointer;
            font: inherit;
            padding: .8rem 1rem;
        }

        button:hover {
            border-color: var(--signal);
            color: var(--signal-soft);
        }

        button:focus-visible {
            outline: 2px solid var(--signal);
            outline-offset: 3px;
        }

        button:disabled {
            cursor: not-allowed;
            opacity: .5;
        }

        .status {
            line-height: 1.6;
            margin-top: 1.5rem;
            min-height: 1.6em;
        }

        @keyframes pulse {
            from {
                opacity: .4;
                transform: scale(.75);
            }

            to {
                opacity: 1;
                transform: scale(1.15);
            }
        }

        @media (max-width: 32rem) {
            .probe-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .signal-track {
                gap: .6rem;
            }

            .actions button {
                flex: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <section class="probe is-loading" aria-labelledby="page-title">
            <header class="probe-header">
                <div>
                    <p class="eyebrow">Connection observer</p>
                    <h1 id="page-title">网络探针</h1>
                </div>
                <p class="connection-state">
                    <span class="signal-dot" aria-hidden="true"></span><span id="state-label">检测中</span>
                </p>
            </header>

            <div class="readout">
                <span class="readout-label">你的请求地址</span>
                <div class="signal-track">
                    <output id="ip-value" aria-live="polite">正在读取…</output>
                </div>
            </div>

            <div class="actions">
                <button id="copy-button" type="button" disabled>复制地址</button>
                <button id="refresh-button" type="button">重新检测</button>
            </div>
            <p class="status" id="status-text" role="status">结果来自当前连接，不会发送给第三方。</p>
        </section>
    </main>

    <script>
        const probe = document.querySelector('.probe');
        const ipValue = document.querySelector('#ip-value');
        const stateLabel = document.querySelector('#state-label');
        const statusText = document.querySelector('#status-text');
        const copyButton = document.querySelector('#copy-button');
        const refreshButton = document.querySelector('#refresh-button');
        let currentIp = '';

        function showState(state, value, message) {
            probe.classList.toggle('is-loading', state === 'loading');
            probe.classList.toggle('is-error', state === 'error');
            ipValue.textContent = value;
            stateLabel.textContent = state === 'loading' ? '检测中' : state === 'error' ? '未连接' : '已连接';
            statusText.textContent = message;
            copyButton.disabled = state !== 'success';
            refreshButton.disabled = state === 'loading';
        }

        async function loadIp() {
            currentIp = '';
            showState('loading', '正在读取…', '正在通过当前连接查询地址。');
            try {
                const response = await fetch('/api/ip', { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`服务返回 ${response.status}`);
                }
                const data = await response.json();
                if (typeof data.ip !== 'string' || !data.ip) {
                    throw new Error('服务未返回有效地址');
                }
                currentIp = data.ip;
                showState('success', currentIp, '结果来自当前连接，不会发送给第三方。');
            } catch (error) {
                showState('error', '无法读取地址', `查询失败：${error.message}。请重新检测。`);
            }
        }

        async function copyIp() {
            if (!currentIp) {
                return;
            }
            try {
                await navigator.clipboard.writeText(currentIp);
                statusText.textContent = '地址已复制到剪贴板。';
            } catch (error) {
                statusText.textContent = '无法自动复制。你可以选中上方地址后手动复制。';
            }
        }

        refreshButton.addEventListener('click', loadIp);
        copyButton.addEventListener('click', copyIp);
        loadIp();
    </script>
</body>
</html>
