# Log4j2 运行期参数，必须放在 classpath 根目录，由 Log4j2 在初始化时读取。
#
# 让 ThreadContext(MDC) 底层改用 InheritableThreadLocal，
# 这样 new Thread(...) 这类临时子线程可以自动继承父线程的 traceId。
#
# 注意：线程池的线程是复用的，创建时机不确定，光靠继承会把旧的 traceId 长期带在池线程上。
# 线程池场景请使用 TraceTaskDecorator 或 TraceExecutors 显式传递，它们会在任务结束后还原上下文。
log4j2.isThreadContextMapInheritable=true
